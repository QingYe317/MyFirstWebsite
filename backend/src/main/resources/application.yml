# 后端服务配置：端口 8080，数据库 personal_site
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/personal_site?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 启动时自动执行建表和插入示例数据（配合 schema.sql / data.sql，幂等可重复启动）
  sql:
    init:
      mode: always
      encoding: utf-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis-plus:
  configuration:
    # 数据库下划线字段自动映射为 Java 驼峰属性，如 created_at -> createdAt
    map-underscore-to-camel-case: true
